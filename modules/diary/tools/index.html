<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日记帮写 - 小度陪你记录每一天</title>
  
  <!-- 全局样式 -->
  <link rel="stylesheet" href="../common/css/variables.css">
  <link rel="stylesheet" href="../common/css/components.css">
  <!-- 工具专用样式 -->
  <link rel="stylesheet" href="css/tool-style.css">
</head>
<body>

  <!-- 动态天气背景 -->
  <div class="weather-bg" id="weatherBg">
    <div class="weather-particles" id="weatherParticles"></div>
    <!-- 晴天放射光芒太阳 -->
    <div class="weather-sun" id="weatherSun">
      <div class="sun-core"></div>
      <div class="sun-rays">
        <div class="sun-ray"></div><div class="sun-ray"></div>
        <div class="sun-ray"></div><div class="sun-ray"></div>
        <div class="sun-ray"></div><div class="sun-ray"></div>
        <div class="sun-ray"></div><div class="sun-ray"></div>
      </div>
    </div>
    <!-- 晴天小鸟 -->
    <div class="weather-birds" id="weatherBirds"></div>
    <!-- 暴风雨闪电效果 -->
    <div class="weather-lightning" id="weatherLightning"></div>
    <!-- 小雨水洼涟漪 -->
    <div class="weather-ripples" id="weatherRipples"></div>
  </div>

  <!-- 主容器 -->
  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <h1 class="logo">📝 日记帮写</h1>
      <div class="header-btns">
        <button class="template-btn" id="templateUploadBtn">📄 上传范本</button>
        <button class="history-btn" id="historyBtn">📚 历史日记</button>
      </div>
      <input type="file" id="templateFileInput" accept=".txt,.md" style="display:none">
      <div class="template-status" id="templateStatus" style="display:none"></div>
    </header>

    <!-- 日记生成进度条（仅生成时显示） -->
    <div class="gen-progress" id="genProgress" style="display:none">
      <div class="gen-progress-header">
        <span class="gen-progress-title">🌸 阿露正在为你写日记</span>
        <span class="gen-progress-percent" id="genProgressPercent">0%</span>
      </div>
      <div class="gen-progress-bar">
        <div class="gen-progress-fill" id="genProgressFill"></div>
      </div>
      <div class="gen-progress-stage" id="genProgressStage">收集素材...</div>
    </div>

    <!-- 聊天区域 -->
    <div class="chat-container" id="chatContainer">
      <div class="chat-messages" id="chatMessages">
        <!-- 消息将通过 JS 动态添加 -->
      </div>
      
      <!-- 选项区域 -->
      <div class="options-container" id="optionsContainer">
        <!-- 选项将通过 JS 动态添加 -->
      </div>
      
      <!-- 输入区域 -->
      <div class="input-area" id="inputArea" style="display: none;">
        <textarea 
          class="textarea-field" 
          id="userInput" 
          placeholder="说说你的想法..."
          rows="3"
        ></textarea>
        <button class="btn-primary" id="sendBtn">发送</button>
      </div>
    </div>

    <!-- 日记展示区域（初始隐藏） -->
    <div class="diary-container" id="diaryContainer" style="display: none;">
      <div class="diary-card">
        <div class="diary-header">
          <h2 class="diary-title" id="diaryTitle"></h2>
          <div class="diary-meta">
            <span class="diary-date" id="diaryDate"></span>
            <div class="diary-tags" id="diaryTags"></div>
          </div>
        </div>
        <div class="diary-content" id="diaryContent"></div>
        <div class="diary-actions">
          <button class="btn-primary" id="downloadBtn">📥 下载日记</button>
          <button class="btn-secondary" id="shareBtn">🔗 分享日记</button>
          <button class="btn-secondary" id="newDiaryBtn">✏️ 写新日记</button>
        </div>
      </div>
    </div>

    <!-- 历史记录视图（初始隐藏） -->
    <div class="history-container" id="historyContainer" style="display: none;">
      <div class="history-header">
        <h2 class="history-title">📚 我的日记</h2>
        <button class="history-back-btn" id="historyBackBtn">← 返回</button>
      </div>
      <div class="history-list" id="historyList">
        <!-- 历史记录将通过 JS 动态添加 -->
      </div>
      <div class="history-empty" id="historyEmpty" style="display: none;">
        <p>还没有写过日记哦~</p>
        <button class="btn-primary" id="writeFirstBtn">写一篇日记</button>
      </div>
    </div>
  </div>

  <!-- 音量控制 -->
  <div class="volume-toggle" id="volumeToggle">
    <svg viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
  </div>
  
  <div class="volume-panel" id="volumePanel">
    <div class="panel-title">
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      音量控制
    </div>
    <div class="volume-row">
      <div class="vol-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <span class="vol-label">BGM</span>
      <input type="range" id="bgmVolume" min="0" max="100" value="15">
      <span class="vol-value" id="bgmVolVal">15%</span>
    </div>
    <div class="volume-divider"></div>
    <div class="volume-row">
      <div class="vol-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <span class="vol-label">环境音</span>
      <input type="range" id="ambientVolume" min="0" max="100" value="50">
      <span class="vol-value" id="ambientVolVal">50%</span>
    </div>
  </div>

  <!-- 脚本引入 -->
  <script src="../common/js/utils.js"></script>
  <script src="../common/js/ai-proxy.js"></script>
  <script src="../common/js/agents/alu-agent.js"></script>
  <script src="js/modules/weather.js"></script>
  <script src="js/modules/audio.js"></script>
  <script src="js/modules/diary.js"></script>
  <script src="js/modules/history.js"></script>
  <script src="js/modules/workflow.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
